services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pgmonitor
      POSTGRES_PASSWORD: pgmonitor
      POSTGRES_DB: pgmonitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pgmonitor_storage
      POSTGRES_PASSWORD: pgmonitor_storage
      POSTGRES_DB: pgmonitor_storage
    ports:
      - "5434:5432"
    volumes:
      - timescaledata:/var/lib/postgresql/data

volumes:
  pgdata:
  timescaledata:
